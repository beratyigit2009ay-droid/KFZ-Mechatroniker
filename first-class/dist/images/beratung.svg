      <path d="M204 289l6 6 11-13" fill="none" stroke="#8a6a2c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="238" y="295" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#23252a">Schloss &amp; Zylinder</text><rect x="200" y="328" width="22" height="22" rx="4" fill="none" stroke="#8a6a2c" stroke-width="2"/>
      <path d="M204 339l6 6 11-13" fill="none" stroke="#8a6a2c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="238" y="345" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#23252a">Schutzbeschlag</text><rect x="200" y="378" width="22" height="22" rx="4" fill="none" stroke="#8a6a2c" stroke-width="2"/>
      <path d="M204 389l6 6 11-13" fill="none" stroke="#8a6a2c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="238" y="395" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#23252a">Zusatzsicherung</text><rect x="200" y="428" width="22" height="22" rx="4" fill="none" stroke="#8a6a2c" stroke-width="2"/>
      
      <text x="238" y="445" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#23252a">Kosten besprochen</text>
  </g>
  <!-- Stift -->
  <g transform="translate(540 120) rotate(62)" filter="url(#shadow)">
    <rect x="0" y="-7" width="230" height="14" rx="7" fill="#23262b" stroke="url(#gold)" stroke-width="1.5"/>
    <rect x="160" y="-7" width="10" height="14" fill="url(#gold)"/>
    <path d="M230-7l26 7-26 7Z" fill="url(#gold)"/>
