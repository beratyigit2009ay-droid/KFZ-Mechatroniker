    <rect x="170" y="120" width="320" height="16" fill="#22252a"/>
    <circle cx="205" cy="112" r="5" fill="#efe7d7" opacity=".85"/><circle cx="247" cy="112" r="5" fill="#efe7d7" opacity=".85"/><circle cx="289" cy="112" r="5" fill="#efe7d7" opacity=".85"/><circle cx="331" cy="112" r="5" fill="#efe7d7" opacity=".85"/><circle cx="373" cy="112" r="5" fill="#efe7d7" opacity=".85"/><circle cx="415" cy="112" r="5" fill="#efe7d7" opacity=".85"/><circle cx="457" cy="112" r="5" fill="#efe7d7" opacity=".85"/>
