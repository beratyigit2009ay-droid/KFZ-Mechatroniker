<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1d21"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e6c6"/>
      <stop offset=".45" stop-color="#d5b475"/>
      <stop offset="1" stop-color="#8a6a2c"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e6c6"/>
      <stop offset=".5" stop-color="#c9a35c"/>
      <stop offset="1" stop-color="#7d5f27"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25282d"/>
      <stop offset=".6" stop-color="#191b1f"/>
      <stop offset="1" stop-color="#121417"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#131518"/>
      <stop offset=".5" stop-color="#1a1d21"/>
      <stop offset="1" stop-color="#121417"/>
    </linearGradient>
    <linearGradient id="warmV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe2ad"/>
      <stop offset=".55" stop-color="#e9b766"/>
      <stop offset="1" stop-color="#a8762e"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd38a" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ffd38a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f0c47a" stop-opacity=".42"/>
      <stop offset=".45" stop-color="#d9a85a" stop-opacity=".12"/>
      <stop offset="1" stop-color="#d9a85a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c49e56" stroke-opacity=".065"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  
  <ellipse cx="420" cy="290" rx="360" ry="230" fill="url(#glow)" opacity=".45"/>
  <!-- Seitenansicht -->
  <g transform="translate(150 196)" filter="url(#shadow)">
    <path d="M0 18Q0 0 18 0H442Q460 0 460 18V70H260V116Q260 124 252 124H208Q200 124 200 116V70H0Z" fill="url(#gold)"/>
    <path d="M0 70H200M260 70H460" stroke="#000" stroke-opacity=".22" stroke-width="2"/>
    <path d="M206 70Q230 154 254 70" fill="#a8833e" stroke="#000" stroke-opacity=".25"/>
    <rect x="0" y="70" width="200" height="50" fill="url(#gold)" opacity=".85"/>
    <rect x="260" y="70" width="200" height="50" fill="url(#gold)" opacity=".85"/>
    <circle cx="230" cy="104" r="9" fill="#1a1408" opacity=".8"/>
    <circle cx="40" cy="35" r="5" fill="#000" opacity=".22"/><circle cx="70" cy="35" r="5" fill="#000" opacity=".22"/><circle cx="100" cy="35" r="5" fill="#000" opacity=".22"/><circle cx="130" cy="35" r="5" fill="#000" opacity=".22"/><circle cx="160" cy="35" r="5" fill="#000" opacity=".22"/>
    <circle cx="300" cy="35" r="5" fill="#000" opacity=".22"/><circle cx="330" cy="35" r="5" fill="#000" opacity=".22"/><circle cx="360" cy="35" r="5" fill="#000" opacity=".22"/><circle cx="390" cy="35" r="5" fill="#000" opacity=".22"/><circle cx="420" cy="35" r="5" fill="#000" opacity=".22"/>
  </g>
  <!-- Schlüssel tritt von links ein -->
  <g transform="translate(64 232) rotate(0) scale(0.62)" filter="url(#shadow)">
    <path fill-rule="evenodd" fill="url(#gold)" d="M-28 0a28 28 0 1 0 56 0a28 28 0 1 0-56 0ZM-10 0a10 10 0 1 0 20 0a10 10 0 1 0-20 0Z"/>
    <rect x="24" y="-11" width="12" height="22" rx="3" fill="url(#gold)"/>
    <path fill="url(#gold)" d="M34-6H150l6 6-6 6H140v9h-7v-6h-8v11h-8v-11h-9v8h-8v-8H95v6h-8v-6H34Z"/>
    <path d="M42 0H140" stroke="#000" stroke-opacity=".28" stroke-width="2"/>
    <circle r="13.5" fill="none" stroke="#000" stroke-opacity=".18"/>
  </g>
  <!-- Frontansicht -->
  <g transform="translate(690 452) scale(1.55)">
    <path d="M-10 13.75A17 17 0 1 1 10 13.75V49Q10 53 6 53H-6Q-10 53-10 49Z" fill="url(#gold)" stroke="#c49e56" stroke-width="1"/>
    <circle r="11.5" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="1.2"/>
    <path d="M0-8V9" stroke="#1a1408" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <text x="690" y="560" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2.8000000000000003" fill="#e5cc96" fill-opacity="0.85" text-anchor="middle">FRONTANSICHT</text>
  <!-- Bemaßung -->
  <g stroke="#c49e56" stroke-opacity=".55" fill="none">
    <path d="M150 160L380 160"/><path d="M150 153v14M380 153v14"/>
  </g><text x="265" y="150" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#c49e56" fill-opacity=".75" text-anchor="middle">A</text>
  <g stroke="#c49e56" stroke-opacity=".55" fill="none">
    <path d="M380 160L610 160"/><path d="M380 153v14M610 153v14"/>
  </g><text x="495" y="150" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#c49e56" fill-opacity=".75" text-anchor="middle">B</text>
  <g>
    <circle cx="380" cy="316" r="4" fill="none" stroke="#e5cc96" stroke-width="1.4"/>
    <circle cx="380" cy="316" r="1.6" fill="#e5cc96"/>
    <path d="M380 316L300 400H274" fill="none" stroke="#c49e56" stroke-opacity=".7"/>
    <text x="264" y="404.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3.3600000000000003" fill="#e5cc96" fill-opacity="0.85" text-anchor="end">SCHLIESSBART</text>
  </g>
  <g>
    <circle cx="380" cy="300" r="4" fill="none" stroke="#e5cc96" stroke-width="1.4"/>
    <circle cx="380" cy="300" r="1.6" fill="#e5cc96"/>
    <path d="M380 300L470 400H496" fill="none" stroke="#c49e56" stroke-opacity=".7"/>
    <text x="506" y="404.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3.3600000000000003" fill="#e5cc96" fill-opacity="0.85" text-anchor="start">STULPSCHRAUBE</text>
  </g>
  <!-- Schriftfeld -->
  <g transform="translate(48 470)">
    <rect width="250" height="82" fill="none" stroke="#c49e56" stroke-opacity=".5"/>
    <path d="M0 40H250M150 40V82" stroke="#c49e56" stroke-opacity=".5"/>
    <text x="16" y="26" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3.3600000000000003" fill="#e5cc96" fill-opacity="0.85" text-anchor="start">PROFILZYLINDER</text>
    <text x="16" y="66" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2.8000000000000003" fill="#e5cc96" fill-opacity="0.65" text-anchor="start">DIN 18252</text>
    <text x="166" y="66" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2.8000000000000003" fill="#e5cc96" fill-opacity="0.65" text-anchor="start">BLATT 1</text>
  </g>
  
  <rect width="800" height="600" fill="url(#vignette)"/>
</svg>
